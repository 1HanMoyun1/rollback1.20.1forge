plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '6.0.53'
    id 'org.spongepowered.mixin' version '0.7.38'
}

// ---- 多版本支持：用 -Pmc=<minecraft 版本> 选择 versions/<版本>.properties ----
def mcTarget = findProperty('mc') ?: '1.20.1'
def versionFile = file("versions/${mcTarget}.properties")
if (versionFile.exists()) {
    def props = new Properties()
    versionFile.withInputStream { props.load(it) }
    props.each { key, value -> ext.set(key.toString(), value.toString()) }
    logger.lifecycle("[rollbackmod] Building for MC ${mcTarget}")
} else {
    throw new GradleException("Unknown MC target '${mcTarget}': missing ${versionFile}")
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(
        (mcTarget == '1.20.5' || mcTarget == '1.20.6') ? 21 : 17)

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

mixin {
    add sourceSets.main, "rollbackmod.refmap.json"
    config "rollbackmod.mixins.json"
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
}
sourceSets.main.java.srcDir "src/versioned/${mcTarget}/java"
sourceSets.main.resources.srcDir "src/versioned/${mcTarget}/resources"

// GameTest 只对主版本(1.20.1)编译（其他版本的原版/加载器 API 不同）
if (mcTarget != '1.20.1') {
    sourceSets.main.java.exclude '**/gameTest/**'
}

repositories {
    maven {
        url = "https://maven.shedaniel.me/"
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    implementation fg.deobf("me.shedaniel.cloth:cloth-config-forge:11.1.136")
    compileOnly 'org.spongepowered:mixin:0.8.5'
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

tasks.named('processResources', ProcessResources).configure {
    def replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named('jar', Jar).configure {
    // 产物名：模组名-模组版本-游戏版本-加载器
    archiveFileName = "${mod_id}-${mod_version}-${minecraft_version}-forge.jar"

    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

// Forge 1.20.5+ 运行改用官方映射，不再有 reobfJar 任务
if (tasks.findByName('reobfJar') != null) {
    tasks.named('jar').configure { finalizedBy 'reobfJar' }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}
